seed: 42

data:
  csv_path: data/raw/solar.csv
  datetime_column: datetime_utc
  target_column: GI
  city_column: city
  sequence_length: 24
  test_cities: [Tunis]
  validation_fraction: 0.20

features:
  numeric:
    - DNI
    - DHI
    - Clearsky_GHI
    - Clearsky_DNI
    - Clearsky_DHI
    - SH
    - Solar_Zenith_Angle
    - is_day
    - T
    - WS
    - WD
    - RH
    - P
    - CC
    - PA
    - hour_sin
    - hour_cos
    - day_of_year_sin
    - day_of_year_cos
    - month_sin
    - month_cos

model:
  type: cnn_wnn_mmha
  hidden_size: 64
  num_layers: 2
  num_heads: 4
  dropout: 0.20

training:
  epochs: 120
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 15

output:
  directory: results
