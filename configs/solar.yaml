seed: 42

data:
  csv_path: data/raw/solar.csv
  datetime_column: datetime_utc
  target_column: GHI
  city_column: city
  sequence_length: 24
  test_cities: [Tokyo]
  validation_fraction: 0.20

features:
  numeric:
    - DNI
    - DHI
    - ClearSky_GHI
    - Temperature_2m
    - Relative_Humidity_2m
    - Surface_Pressure
    - Wind_Speed_10m
    - Wind_Direction_10m
    - Precipitation
    - clear_sky_index
    - is_day
    - hour_sin
    - hour_cos
    - day_of_year_sin
    - day_of_year_cos
    - month_sin
    - month_cos

model:
  type: transformer
  hidden_size: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.20

training:
  epochs: 120
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.00001
  patience: 15

output:
  directory: results
